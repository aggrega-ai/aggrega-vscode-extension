name: Package and publish

# Builds the extension's installable package (a .vsix) and publishes that one
# file to the Visual Studio Marketplace and to Open VSX.
#
# The package job runs on every push and pull request to main or dev, on every
# release tag and on every manual run. It builds the package once, with
# scripts/vsix.js, and uploads it as this run's artifact `vsix`. `node
# scripts/vsix.js --help` is the contract of every step below that runs the
# script.
#
# 🔴 ONLY A PUSHED RELEASE TAG CAN PUBLISH, AND DRY_RUN DECIDES WHETHER IT DOES.
# A listing on either marketplace is public from the moment it is published. A
# publish step runs only on a pushed release tag, v followed by package.json's
# version (v0.1.0 for 0.1.0) on a commit of main; the package job refuses any
# other tag before it builds, so neither publish job starts. No branch push and
# no pull request reaches the publish jobs. DRY_RUN, under env below, is the one
# switch: unless it reads false, a tag's run signs in to each marketplace, checks
# that sign-in with the marketplace's verify mode and publishes nothing. Set to
# false, a tag's run uploads the very file the package job of the same run built
# — never a second build, and never the working folder, which each marketplace's
# own publish command packages and uploads when it is handed no file. A tag runs
# this file as the commit it names holds it, so the switch a tag obeys is the one
# in that commit.
#
# 🔴 A MANUAL RUN IS ALWAYS A DRY RUN, AND IT USES NO VERSION. Started by hand from
# main, it builds and uploads the package, then runs each marketplace's verify
# mode, whatever DRY_RUN reads: no publish step runs on a manual run. It needs no
# tag, so no version's tag is spent on it:
#
#   gh workflow run package-and-publish.yml --repo aggrega-ai/aggrega-vscode-extension --ref main
#
# The run uses this file as main holds it. Both publish jobs name the release
# environment, whose branch and tag rule admits main and release tags; a manual
# run from any other branch fails those two jobs at the environment, after the
# package job. The managed identity's federated credential names the environment,
# so with the identity configured a manual run signs in to the Visual Studio
# Marketplace as the identity, prints its member id and checks the sign-in. With
# VSCE_PAT configured instead, a manual run checks that token, which no federated
# credential governs. The Open VSX check runs either way.
#
# Settings, by name:
#   repository secrets
#             SUBMODULE_APP_CLIENT_ID    the organization App that reads the
#             SUBMODULE_APP_PRIVATE_KEY  private sibling repositories
#   release-environment secrets
#             OVSX_PAT                   the Open VSX access token
#             VSCE_PAT                   a Marketplace personal access token, read
#                                        only when none of the three Azure
#                                        variables below is set
#   release-environment variables
#             AZURE_CLIENT_ID            the managed identity the Marketplace job
#             AZURE_TENANT_ID            signs in as, through GitHub Actions'
#             AZURE_SUBSCRIPTION_ID      OpenID Connect login
#   repository variable
#             AGGREGA_RUNNER             the package job's runner label (optional,
#                                        a hosted runner by default)

on:
  push:
    branches: [main, dev]
    # A release tag: vMAJOR.MINOR.PATCH, with no pre-release suffix.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main, dev]
  # A manual run: always a dry run, whatever DRY_RUN reads (see above).
  workflow_dispatch:

permissions:
  contents: read

env:
  # 🔴 THE ONE SWITCH BETWEEN A DRY RUN AND A REAL PUBLISH. Anything but false —
  # this line removed included — is a dry run. Set it to false, commit, and tag
  # that commit to publish; nothing else in this file changes. A manual run is
  # a dry run whatever this line says.
  DRY_RUN: false
  # The branch every sibling checkout reads. The siblings follow the branch
  # under test: a run on dev, or a pull request into it, reads their dev; every
  # other run, a release tag's included, reads their main. The kits' pdk.yml in
  # aggrega-pdk keeps the same value, so a change here is made there too.
  SIBLING_REF: ${{ (github.ref_name == 'dev' || github.base_ref == 'dev') && 'dev' || 'main' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A newer push supersedes a package build still running for the same branch. A
  # tag's run is never cancelled, so a publish is never stopped half way.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    # Shared self-hosted-runner switch: set the AGGREGA_RUNNER org/repo variable to route here.
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Mint org app token for private-sibling access
        # The extension compiles only beside two private sibling repositories:
        # the wire contract it type-checks against and the compiler, whose
        # build-version recipe stamps the package. The token reads them.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Every checkout keeps its token out of the repository's configuration
      # (persist-credentials: false): the build reads the checkouts and never
      # fetches from GitHub again, so nothing later in the job, the installed
      # npm packages included, finds a credential on disk.
      - name: Check out the extension with full history and tags
        # The package's build stamp names the release tag the commit carries,
        # which needs the extension's history and tags.
        uses: actions/checkout@v5
        with:
          path: aggrega-vscode-extension
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out the wire contract beside it
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-abi
          ref: ${{ env.SIBLING_REF }}
          path: aggrega-abi
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Check out the compiler beside it
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-cli
          ref: ${{ env.SIBLING_REF }}
          path: aggrega-cli
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Node
        # 🔴 AN EXACT VERSION, BECAUSE THE INSTALL-SCRIPT POLICY DEPENDS ON ITS npm.
        # package.json's allowScripts denies the install script of keytar, an
        # optional native module the Open VSX client's dependencies bring, which
        # would otherwise download a prebuilt binary the lockfile's integrity
        # record does not cover. The npm this Node release bundles honours that
        # denial; an npm that predates allowScripts ignores it and runs the
        # script. Move this version only to one whose bundled npm honours it.
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'

      - name: Refuse a tag that is not a release of this version on main
        # A pushed tag is the only run that can publish, so it must name a
        # release of this extension: v followed by package.json's version, on a
        # commit of main. Anything else stops here, before the package is built,
        # so neither publish job starts and nothing signs in.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: aggrega-vscode-extension
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag $TAG does not name this extension's version: package.json says $version, so its release tag is v$version" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::this checkout holds no main branch to find the tagged commit on" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::the tag $TAG names a commit that is not on main; tag a commit of main" >&2
            exit 1
          fi
          echo "release tag $TAG: package.json's version $version, on a commit of main"

      - name: Make this run's package directory
        # 🔴 A DIRECTORY NO EARLIER RUN HAS USED. A self-hosted runner can keep
        # what an earlier job left under its temporary directory, and the
        # packager refuses a work directory that is not empty and an output
        # directory already holding the .vsix it is about to write. So each run
        # makes a new directory of its own there, holding the build's work
        # directory (work/) and the one .vsix (out/), and the last step of this
        # job removes it.
        id: package-dir
        run: |
          set -euo pipefail
          dir="$(mktemp -d "$RUNNER_TEMP/vsix.XXXXXXXXXX")"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "this run's package directory: $dir"

      - name: Build the package
        # Builds from the checkouts' commits in this run's work directory,
        # outside them, and writes the one .vsix into this run's out/.
        env:
          PACKAGE_DIR: ${{ steps.package-dir.outputs.dir }}
        run: |
          set -euo pipefail
          node aggrega-vscode-extension/scripts/vsix.js package \
            --source aggrega-vscode-extension \
            --abi aggrega-abi \
            --cli aggrega-cli \
            --work "$PACKAGE_DIR/work" \
            --out "$PACKAGE_DIR/out"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package-dir.outputs.dir }}/out/*.vsix
          if-no-files-found: error

      - name: Remove this run's package directory
        # Whatever the job's outcome, once the directory exists. Owner write
        # permission is restored first, so no read-only entry the build left
        # stands in the way. A removal that still fails warns rather than
        # failing the job: the build and the upload have already given the
        # job its verdict, and no later run reads this directory, since each
        # makes its own.
        if: ${{ always() && steps.package-dir.outputs.dir != '' }}
        env:
          PACKAGE_DIR: ${{ steps.package-dir.outputs.dir }}
        run: |
          set -uo pipefail
          chmod -R u+w -- "$PACKAGE_DIR" || true
          rm -rf -- "$PACKAGE_DIR" || true
          if [ -e "$PACKAGE_DIR" ]; then
            echo "::warning::could not remove this run's package directory $PACKAGE_DIR; no later run reads it, so remove it by hand"
          else
            echo "removed this run's package directory: $PACKAGE_DIR"
          fi

  publish-marketplace:
    # Publishes to the Visual Studio Marketplace, or on a dry run checks that the
    # sign-in may publish as package.json's publisher.
    #
    # It signs in with the managed identity when AZURE_CLIENT_ID, AZURE_TENANT_ID
    # and AZURE_SUBSCRIPTION_ID are all set: GitHub Actions' OpenID Connect login
    # signs the Azure CLI in as that identity, and the packager's Microsoft Entra ID
    # sign-in takes its token from there. When none of the three is set it reads
    # the token in VSCE_PAT instead; when only some are set, or neither the
    # identity nor the token is, it refuses before anything runs.
    #
    # The job names the release environment, and the identity's federated
    # credential names that environment: a run of this job, from a release tag or
    # from a manual run on main, presents the environment's subject when it asks
    # for an OpenID Connect token. Any job naming the environment and asking for
    # that token could sign in as the identity; only this job asks. publish-open-vsx
    # is in the environment too and cannot mint an OIDC token, since it holds no
    # id-token permission.
    #
    # A hosted runner, whatever the package job uses: it carries the Azure CLI the
    # sign-in goes through, and it is discarded after the job, so no sign-in
    # outlives it.
    #
    # A pushed release tag, or a manual run, which is always a dry run (see the
    # top of this file).
    needs: package
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the job ask GitHub for the OpenID Connect token the managed
      # identity's sign-in exchanges. This job only.
      id-token: write
    steps:
      - name: Choose how to sign in
        id: sign-in
        # The three Azure values are identifiers, read as variables; HAS_TOKEN is
        # only whether VSCE_PAT is set, so no secret's value reaches this step.
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          HAS_TOKEN: ${{ secrets.VSCE_PAT != '' }}
        run: |
          set -euo pipefail
          set_count=0
          for value in "$AZURE_CLIENT_ID" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID"; do
            if [ -n "$value" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -eq 3 ]; then
            echo "identity=true" >> "$GITHUB_OUTPUT"
            echo "signing in with the managed identity AZURE_CLIENT_ID names"
          elif [ "$set_count" -gt 0 ]; then
            echo "::error::AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID are only partly set; set all three to sign in with the managed identity, or none of them to sign in with VSCE_PAT" >&2
            exit 1
          elif [ "$HAS_TOKEN" = true ]; then
            echo "identity=false" >> "$GITHUB_OUTPUT"
            echo "no managed identity is configured; signing in with the personal access token in VSCE_PAT"
          else
            echo "::error::no Marketplace sign-in is configured: set AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID for the managed identity, or VSCE_PAT for a personal access token" >&2
            exit 1
          fi

      - name: Mint org app token for private-sibling access
        # The publish runs the packager installed from the extension's lockfile,
        # and installing the extension's dependencies needs the wire contract
        # beside it.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out the extension
        uses: actions/checkout@v5
        with:
          path: aggrega-vscode-extension
          persist-credentials: false

      - name: Check out the wire contract beside it
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-abi
          ref: ${{ env.SIBLING_REF }}
          path: aggrega-abi
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Node
        # The same exact version as the package job, for the same reason.
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'

      - name: Install the packager from the lockfile
        working-directory: aggrega-vscode-extension
        run: npm ci --no-audit --no-fund

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Find the package
        # The artifact holds the one file the package job built; anything else
        # refuses, so no publish can pick between two files.
        id: package
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/vsix/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::the vsix artifact holds ${#files[@]} .vsix files, where the package job writes exactly one" >&2
            exit 1
          fi
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "package: ${files[0]}"

      - name: Sign in to Azure as the managed identity
        if: ${{ steps.sign-in.outputs.identity == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Print the managed identity's Marketplace member id (dry run)
        # The identity can publish only once it is added to package.json's
        # publisher as a Contributor, and the publisher adds it by an id that
        # only a sign-in as the identity can read: the `id` of its profile. The
        # Azure CLI the step above signed in reads that profile, with a token for
        # the service --resource names (the one the packager's Microsoft Entra ID
        # sign-in asks for), and prints its id alone, never the rest of the
        # profile, so the id can be added to the publisher, as the sign-in check
        # below needs. A failed lookup does not stop the job: the sign-in check
        # runs whatever this step finds. On a manual run too, which is always a
        # dry run.
        if: ${{ (env.DRY_RUN != 'false' || github.event_name == 'workflow_dispatch') && steps.sign-in.outputs.identity == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "the managed identity's Visual Studio Marketplace member id, to add to package.json's publisher as a Contributor:"
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      - name: Check the sign-in (dry run)
        # Checks the managed identity's sign-in, or VSCE_PAT's token when no
        # identity is configured.
        if: ${{ env.DRY_RUN != 'false' || github.event_name == 'workflow_dispatch' }}
        # 🔴 BOUNDED, BECAUSE THE ENTRA ID SIGN-IN WAITS MINUTES BEFORE IT REFUSES.
        # With no usable sign-in it tries the managed-identity endpoint of an Azure
        # machine, which does not answer here, and gives up only after several
        # minutes; the bound makes that a failed step rather than a long silence.
        timeout-minutes: 5
        working-directory: aggrega-vscode-extension
        env:
          # The token reaches the script only when no managed identity is
          # configured; otherwise it is empty, and the script signs in with
          # Microsoft Entra ID.
          VSCE_PAT: ${{ steps.sign-in.outputs.identity != 'true' && secrets.VSCE_PAT || '' }}
        run: node scripts/vsix.js verify-marketplace

      - name: Publish the package
        # A pushed tag only: a manual run, even one started on a tag, never
        # publishes.
        if: ${{ github.event_name == 'push' && env.DRY_RUN == 'false' && startsWith(github.ref, 'refs/tags/') }}
        timeout-minutes: 10
        working-directory: aggrega-vscode-extension
        env:
          VSCE_PAT: ${{ steps.sign-in.outputs.identity != 'true' && secrets.VSCE_PAT || '' }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: node scripts/vsix.js publish-marketplace "$PACKAGE_FILE"

  publish-open-vsx:
    # Publishes to Open VSX, or on a dry run reads the namespace package.json's
    # publisher names and checks that the token may publish to it.
    #
    # 🔴 NO id-token PERMISSION, AND THAT IS WHAT KEEPS PUBLISHING TIED TO THE TOKEN.
    # The Open VSX client publishes with no token at all whenever it is handed
    # none, an OpenID Connect token is available to the job, and the extension is
    # registered for token-free publishing. This job cannot ask for an OpenID
    # Connect token, and the script refuses unless OVSX_PAT holds an access token,
    # so a publish here always signs in with OVSX_PAT.
    #
    # The job names the release environment, which holds OVSX_PAT.
    #
    # A pushed release tag, or a manual run, which is always a dry run.
    needs: package
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Mint org app token for private-sibling access
        # The publish runs the Open VSX client installed from the extension's
        # lockfile, and installing the extension's dependencies needs the wire
        # contract beside it.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out the extension
        uses: actions/checkout@v5
        with:
          path: aggrega-vscode-extension
          persist-credentials: false

      - name: Check out the wire contract beside it
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-abi
          ref: ${{ env.SIBLING_REF }}
          path: aggrega-abi
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Node
        # The same exact version as the package job, for the same reason.
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'

      - name: Install the Open VSX client from the lockfile
        working-directory: aggrega-vscode-extension
        run: npm ci --no-audit --no-fund

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      - name: Find the package
        # The artifact holds the one file the package job built; anything else
        # refuses, so no publish can pick between two files.
        id: package
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/vsix/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::the vsix artifact holds ${#files[@]} .vsix files, where the package job writes exactly one" >&2
            exit 1
          fi
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "package: ${files[0]}"

      - name: Check the token and the namespace (dry run)
        if: ${{ env.DRY_RUN != 'false' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        working-directory: aggrega-vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/vsix.js verify-open-vsx

      - name: Publish the package
        # A pushed tag only: a manual run, even one started on a tag, never
        # publishes.
        if: ${{ github.event_name == 'push' && env.DRY_RUN == 'false' && startsWith(github.ref, 'refs/tags/') }}
        timeout-minutes: 10
        working-directory: aggrega-vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: node scripts/vsix.js publish-open-vsx "$PACKAGE_FILE"

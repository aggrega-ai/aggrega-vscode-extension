<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!--
  The Aggrega mark in one colour, for use as a mask.

  An activity-bar icon is applied as a mask: the editor discards this file's own
  colours and paints the shape's coverage in the theme's foreground.  So the mark
  is drawn here as a silhouette - a single filled path, whose enclosed counters
  are cut as reverse-wound subpaths of that same path so that they stay open under
  the mask.  A sliver merely painted in a background colour would still be
  covered, and would render solid.

  This is a monogram of the mark rather than the woven mark itself.  In the
  artwork two ribbons pass over and under one another, and that reading is carried
  by the colour boundary between them - including along the long stretches where
  they simply run side by side.  One colour cannot hold a distinction the artwork
  draws with two, so the ribbons are drawn here as one continuous band and no
  crossing is cut.  What the silhouette keeps is the mark's outline and its
  counters: the peak, the two loops below it, and the tails sweeping to the lower
  corners.  Spending the whole shape on that outline is what carries it at 24 px,
  which is the size it is actually read at.

  The wide artwork is re-composed into the square rather than scaled into it, so
  that the mark fills the box; the loops read a little more upright here than in
  the artwork.
  -->
